name: Trigger Daily Pipeline

# Replaces the old scrape.yml, which ran the scraper directly on a
# self-hosted runner (that runner has been decommissioned -- see the
# Mac's ~/Library/LaunchAgents cleanup). This workflow doesn't scrape
# anything itself: it only calls bikroylens-pipeline's /run endpoint on
# Render, which is what actually does the scraping. GitHub's hosted
# runner IP never touches Bikroy.com here, so this doesn't repeat the
# 403 that GitHub Actions hit when it tried to scrape directly.

on:
  schedule:
    - cron: "0 15 * * *" # 21:00 Bangladesh time (UTC+6) daily
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the pipeline run
        run: |
          curl -sf --max-time 120 --retry 3 --retry-delay 5 \
            -X POST "${{ vars.PIPELINE_SERVICE_URL }}/run" \
            -H "X-Trigger-Secret: ${{ secrets.PIPELINE_TRIGGER_SECRET }}"

      - name: Poll status until done (also keeps the free service awake)
        run: |
          for i in $(seq 1 20); do
            sleep 90
            RESPONSE=$(curl -sf --max-time 30 "${{ vars.PIPELINE_SERVICE_URL }}/status")
            STATUS=$(echo "$RESPONSE" | jq -r .status)
            echo "poll $i: $STATUS"
            if [ "$STATUS" = "done" ] || [ "$STATUS" = "failed" ]; then
              echo "$RESPONSE" | jq .
              [ "$STATUS" = "done" ] && exit 0 || exit 1
            fi
          done
          echo "pipeline still running after max polling window (30 min) -- check Render logs"
          exit 1
