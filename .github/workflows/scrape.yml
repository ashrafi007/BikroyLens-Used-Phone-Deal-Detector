name: Daily Bikroy Scrape

on:
  # No `schedule:` trigger — GitHub's cron requires a registered self-hosted
  # runner to be online at the exact tick, and does NOT queue/retry a missed
  # tick. That proved too fragile (lid-close sleep, idle sleep, and network
  # blips all silently dropped scheduled runs with zero record of it even
  # happening). Daily automation now runs from a local launchd job
  # (~/bikroylens-local-scrape/run_daily_scrape.sh) that scrapes and pushes
  # directly, independent of any runner registration. This workflow is kept
  # only for manual on-demand runs from the Actions tab.
  workflow_dispatch: {}

permissions:
  contents: write # needed to commit the new CSV back to the repo

jobs:
  scrape:
    # Bikroy blocks GitHub-hosted cloud runner IPs outright (confirmed: every
    # request came back 403, even robots.txt). Running on a self-hosted
    # runner instead — same machine/IP that scraped successfully manually —
    # sidesteps the block and keeps this at ৳0/month. Trade-off: the host
    # Mac needs to be on and logged in at the scheduled time.
    runs-on: [self-hosted, macOS, bikroylens]
    steps:
      - uses: actions/checkout@v4

      - name: Check if today's data already exists
        id: check
        run: |
          DATE=$(date -u +%F)
          if [ -f "data/bikroy_${DATE}.csv" ]; then
            echo "Already scraped today ($DATE) — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.skip != 'true'
        # macOS system Python is "externally managed" (PEP 668) — same as
        # local dev, needs a venv rather than a bare pip install.
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install --quiet scrapy

      - name: Run spider
        if: steps.check.outputs.skip != 'true'
        working-directory: bikroy_scraper
        run: |
          source ../.venv/bin/activate
          DATE=$(date -u +%F)
          # -O (capital) overwrites rather than appends — keeps each day's
          # file a clean single snapshot even if this workflow ever runs
          # more than once on the same day (e.g. a manual re-trigger).
          scrapy crawl bikroy -O "../data/bikroy_${DATE}.csv" -L INFO

      - name: Commit and push new CSV
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.csv
          if git diff --cached --quiet; then
            echo "No new data to commit"
            exit 0
          fi
          git commit -m "Daily scrape: $(date -u +%F)"
          git push
