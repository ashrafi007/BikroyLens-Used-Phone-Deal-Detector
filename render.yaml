services:
  - type: web
    name: bikroylens-api
    runtime: python
    plan: free
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false # set manually in the Render dashboard — never committed

# A cloud trigger service (bikroylens-pipeline) + GitHub Actions scheduler
# was tried here to get the daily scrape -> load -> normalize -> retrain
# cycle off the Mac. Confirmed dead end: Bikroy 403'd every single request
# from Render's IP too, same as it already had for GitHub Actions' hosted
# runners. Reverted -- the Mac's launchd automation
# (scripts/run_daily_scrape.sh) is the automation, not a fallback.
